name: Bash syntax

on:
  push:
    paths:
      - 'vps-setup.sh'
      - 'install.sh'
      - 'modules/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/bash-syntax.yml'
  pull_request:
    paths:
      - 'vps-setup.sh'
      - 'install.sh'
      - 'modules/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/bash-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: bash -n vps-setup.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n vps-setup.sh
          bash -n install.sh
          bash -n modules/xtls-c2-feed.sh
          echo 'Bash syntax OK'
      - name: Auto Abuse Guard syntax and regression tests
        shell: bash
        run: |
          bash -n modules/xtls-auto-abuse-guard-install.sh
          python3 -m py_compile modules/xtls-auto-abuse-guard.py modules/xtls-spamhaus-udp.py
          sudo python3 -m unittest discover -s tests -v
      - name: Real nftables conntrack direction and migration
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2
          ns="guard-diag-${GITHUB_RUN_ID}"
          trap 'sudo ip netns del "$ns"' EXIT
          sudo ip netns add "$ns"
          sudo ip -n "$ns" link set lo up
          sudo ip netns exec "$ns" python3 tests/check_spamhaus_direction.py
          sudo ip netns exec "$ns" nft delete table inet xtls_spamhaus_out
          sudo ip netns exec "$ns" python3 tests/check_spamhaus_udp_real.py
          sudo ip netns exec "$ns" python3 tests/check_spamhaus_udp_bootstrap_real.py
      - name: C2 real nftables regression tests in a network namespace
        run: sudo python3 tests/check_c2_real_nft.py

  nginx-selfsteal:
    name: Nginx SelfSteal fresh-install configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Nginx TLS, PROXY protocol and certificate webroot
        run: |
          sudo python3 tests/check_nginx_selfsteal_real.py
          domain="$(python3 -c "print('.'.join(['a'*63]*3+['b'*61]))")"
          sudo python3 tests/check_nginx_selfsteal_real.py "$domain"

  selfsteal-domain:
    name: Real Caddy and Nginx domain change / rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change domains without restarting the node
        run: sudo python3 tests/check_selfsteal_domain_real.py

  debian-crowdsec-recovery:
    name: Debian 13 CrowdSec missing configs and purge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover actual package configs and remove distribution bouncer
        run: |
          docker run --rm -v "$PWD:/repo:ro" debian:13 bash -ec '
            printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
            chmod 755 /usr/sbin/policy-rc.d
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-remove python3 crowdsec crowdsec-firewall-bouncer
            python3 /repo/tests/check_crowdsec_recovery_real.py
          '

  ubuntu-crowdsec:
    name: Ubuntu 24.04 packaged CrowdSec Hub
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution package and stop agent metrics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-remove crowdsec
          sudo systemctl stop crowdsec
      - name: Verify installed Hub state without metrics or file changes
        run: sudo python3 tests/check_crowdsec_packaged_hub.py
